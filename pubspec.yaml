
name: smart_vision_reader

description: Smart Vision Reader - A secure vision assistance application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera functionality
  camera: ^0.11.0+2

  # Text recognition using ML Kit
  google_mlkit_text_recognition: ^0.15.0

  # Hindi and English text-to-speech
  flutter_tts: ^4.2.3

  # App permissions
  permission_handler: ^12.0.1

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
